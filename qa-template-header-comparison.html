<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Template Header QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#eef1f5;color:#20242b;font:14px/1.4 Arial,sans-serif}h1{margin:0 0 18px;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{min-width:0;padding:14px;border:1px solid #d6dbe3;border-radius:12px;background:#fff}.panel h2{margin:0 0 10px;font-size:15px}.panel img{display:block;width:100%;height:auto;border:1px solid #e3e6eb;border-radius:8px}.note{margin:10px 0 0;color:#687180;font-size:12px}
  </style>
</head>
<body>
  <h1>Product Map Template header refinement</h1>
  <main class="grid">
    <section class="panel"><h2>Before — SN occupied a third line and Duplicate remained</h2><img src="assets/qa/qa-product-map-template-manager-summary.png" alt="Previous template manager"><p class="note">Terminal Name and SN shared a card, creating three visible text rows.</p></section>
    <section class="panel"><h2>After — SN beside title, two-line cards, no Duplicate</h2><img src="assets/qa/qa-product-map-template-sn-header.png" alt="Updated template manager"><p class="note">Each summary card now contains exactly one label and one value.</p></section>
  </main>
</body>
</html>
