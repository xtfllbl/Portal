<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications | PAYwizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/notifications.css">
  <link rel="stylesheet" href="styles/platform-admin-shell.css">
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="PAYwizard home">
        <span class="brand-mark"><img src="assets/paywizard-logo.png" alt="PAYwizard"></span>
        <span class="brand-environment">PORTAL</span>
      </a>

      <nav class="nav">
        <a class="menu-item" href="#"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">dashboard</span><span>Dashboard</span></span></a>
        <a class="menu-item" href="12.transaction_list.html"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">credit_card</span><span>Transactions</span></span></a>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">group</span><span>Agents</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">store</span><span>Merchants</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">lightbulb</span><span>Partners</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
        <a class="menu-item" href="1.terminalmanage_nayax.html"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">devices</span><span>Device Management</span></span></a>
        <a class="menu-item" href="#"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">cast_connected</span><span>Remote Diagnostic</span></span></a>
        <a class="menu-item" href="#"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">apps</span><span>APP Management</span></span></a>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">redeem</span><span>Prepaid Cards</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">manage_accounts</span><span>User Management</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">settings</span><span>Settings</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
        <a class="menu-item" href="#"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">support_agent</span><span>Tickets</span></span></a>
        <button class="menu-item" type="button" aria-expanded="false"><span class="menu-main"><span class="material-symbols-rounded" aria-hidden="true">code_blocks</span><span>Developer Center</span></span><span class="material-symbols-rounded menu-arrow" aria-hidden="true">expand_more</span></button>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb" aria-label="Breadcrumb"><strong>Notifications</strong></div>
        <div class="top-actions">
          <button class="round-btn" type="button" aria-label="Notifications" aria-current="page">
            <span class="material-symbols-rounded" aria-hidden="true">notifications_none</span>
            <span class="notice-count" data-notification-count>0</span>
          </button>
          <button class="round-btn dark" type="button" aria-label="Open user menu"><span class="material-symbols-rounded" aria-hidden="true">person</span></button>
        </div>
      </header>

      <main class="panel">
        <section class="notifications-view" aria-labelledby="notifications-title">
          <div class="panel-header">
            <h1 class="page-title" id="notifications-title">Notifications</h1>
            <div class="page-actions">
              <button class="btn primary-outline" type="button" data-mark-read disabled>Mark Read</button>
              <button class="btn" type="button" data-mark-all-read>Mark All Read</button>
              <button class="btn dark" type="button" data-refresh>Refresh List</button>
            </div>
          </div>

          <div class="notification-tabs" role="tablist" aria-label="Notification categories">
            <button class="notification-tab" type="button" role="tab" aria-selected="false" data-category="all">All Notifications</button>
            <button class="notification-tab" type="button" role="tab" aria-selected="false" data-category="alerts"><span class="material-symbols-rounded tab-icon alerts" aria-hidden="true">warning</span>Alerts</button>
            <button class="notification-tab" type="button" role="tab" aria-selected="false" data-category="onboarding"><span class="material-symbols-rounded tab-icon onboarding" aria-hidden="true">person</span>Onboarding</button>
            <button class="notification-tab active" type="button" role="tab" aria-selected="true" data-category="leads"><span class="material-symbols-rounded tab-icon leads" aria-hidden="true">campaign</span>Leads</button>
          </div>

          <div class="table-wrap">
            <table class="notifications-table" aria-label="Notifications">
              <colgroup>
                <col class="select-column"><col class="source-column"><col><col class="status-column"><col class="date-column"><col class="actions-column">
              </colgroup>
              <thead>
                <tr>
                  <th><input type="checkbox" aria-label="Select all visible notifications" data-select-all></th>
                  <th>Type/Source</th>
                  <th>Content Details</th>
                  <th>Status</th>
                  <th>Date &amp; Time</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody data-notification-rows></tbody>
            </table>
          </div>
          <p class="sr-only" role="status" aria-live="polite" data-notification-status></p>
        </section>
      </main>
    </div>
  </div>

  <script src="scripts/notifications.js"></script>
  <script src="scripts/platform-admin-shell.js"></script>
</body>
</html>
