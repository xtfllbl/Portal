<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Settings Prototype</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #ffffff; color: #333; display: flex; justify-content: center; padding: 60px;
        }
        .settings-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 32px 64px; max-width: 600px; width: 100%;
        }
        .setting-item { display: flex; flex-direction: column; gap: 12px; }
        .setting-label { font-size: 15px; font-weight: 500; color: #4b5563; }
        
        /* 步进器样式 (Stepper) */
        .stepper-control {
            display: inline-flex; align-items: center; background-color: #f3f4f6; 
            border-radius: 8px; padding: 4px; width: fit-content;
        }
        .stepper-btn {
            border: none; background: #ffffff; border-radius: 6px; width: 28px; height: 28px;
            font-size: 18px; line-height: 1; cursor: pointer; color: #4b5563;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .stepper-btn:hover { background: #e5e7eb; }
        .stepper-btn:active { background: #d1d5db; }
        .stepper-value { padding: 0 16px; font-size: 14px; font-weight: 500; min-width: 80px; text-align: center; }

        /* 下拉菜单样式 */
        .custom-select {
            width: 100%; border: none; border-bottom: 1px solid #e5e7eb; padding: 6px 0 10px 0;
            font-size: 14px; color: #4b5563; background: transparent; outline: none; cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 8px center; background-size: 12px auto;
        }
        .custom-select:focus { border-bottom-color: #0a0a0a; }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="setting-item">
            <span class="setting-label">Receipt Print (1-5 份)</span>
            <div class="stepper-control">
                <button class="stepper-btn" onclick="updateStepper(-1)">−</button>
                <span class="stepper-value" id="print-copies">2 Copies</span>
                <button class="stepper-btn" onclick="updateStepper(1)">+</button>
            </div>
        </div>

        <div class="setting-item">
            <span class="setting-label">Print Mode (5选1)</span>
            <select class="custom-select">
                <option value="standard">Standard Mode</option>
                <option value="eco">Eco-Saving Mode</option>
                <option value="detailed">Detailed Mode</option>
                <option value="summary">Summary Only</option>
                <option value="merchant">Merchant Only</option>
            </select>
        </div>
    </div>

    <script>
        let copies = 2;
        const maxCopies = 5; // 假设最大支持 5 份
        const minCopies = 1;
        
        function updateStepper(change) {
            let newVal = copies + change;
            if (newVal >= minCopies && newVal <= maxCopies) {
                copies = newVal;
                document.getElementById('print-copies').innerText = copies + (copies > 1 ? ' Copies' : ' Copy');
            }
        }
    </script>
</body>
</html>
