<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Payment Channel v2 Focused QA Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #17181b; color: #fff; font: 600 16px Arial, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 10px; }
    .crop { position: relative; width: 100%; aspect-ratio: 1150 / 620; overflow: hidden; background: #fff; }
    img { position: absolute; width: 125%; max-width: none; height: auto; transform: translate(-19%, -7%); }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Source — content focus</figcaption><div class="crop"><img src="source-option-1.png" alt="Selected design source content"></div></figure>
    <figure><figcaption>Implementation — content focus</figcaption><div class="crop"><img src="implementation-desktop.png" alt="Rendered implementation content"></div></figure>
  </main>
</body>
</html>
