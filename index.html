<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paywizard Prototype Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2eee4;
      --bg-soft: #fbf8f1;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: #fffdf8;
      --line: #ded7c8;
      --text: #1d2a36;
      --muted: #607080;
      --accent: #0f8090;
      --accent-strong: #0a5d69;
      --warm: #d5873a;
      --chip: #f4ece0;
      --shadow: 0 22px 48px rgba(31, 43, 55, 0.13);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --preview-width: 1366;
      --preview-height: 900;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(15, 128, 144, 0.2) 0%, transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(213, 135, 58, 0.16) 0%, transparent 35%),
        linear-gradient(180deg, #f6f2e8 0%, #efe9dc 100%);
      padding: 28px;
    }

    .layout {
      max-width: 1480px;
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    .hero {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.86) 0%, rgba(253, 248, 239, 0.8) 100%);
      border: 1px solid rgba(222, 215, 200, 0.85);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 26px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
    }

    .hero h1 {
      margin: 0;
      font-family: "Sora", "Segoe UI", sans-serif;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      max-width: 720px;
      line-height: 1.5;
    }

    .stats {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--surface-strong);
      font-weight: 700;
      color: var(--accent-strong);
      white-space: nowrap;
      text-align: center;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid rgba(222, 215, 200, 0.9);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: grid;
      gap: 14px;
      backdrop-filter: blur(8px);
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .search {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid #cbc4b6;
      background: #fffdf8;
      color: var(--text);
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 128, 144, 0.17);
    }

    .small-note {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      padding-right: 2px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid #d8cebb;
      background: var(--chip);
      color: #314253;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .chip:hover {
      border-color: #b5aa95;
      transform: translateY(-1px);
    }

    .chip.active {
      border-color: var(--accent-strong);
      background: var(--accent-strong);
      color: #f4fcff;
      box-shadow: 0 8px 20px rgba(10, 93, 105, 0.24);
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }

    .page-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      box-shadow: 0 14px 32px rgba(29, 42, 54, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 360px;
    }

    .preview {
      position: relative;
      height: 210px;
      background: #e6ecf0;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .preview::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 34px;
      background: linear-gradient(to top, rgba(16, 24, 33, 0.28), transparent);
      pointer-events: none;
      z-index: 3;
    }

    .preview-status {
      position: absolute;
      right: 12px;
      top: 10px;
      z-index: 4;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(18, 26, 35, 0.78);
      color: #e6f1f7;
      border: 1px solid rgba(230, 241, 247, 0.26);
    }

    .preview-frame {
      width: 1366px;
      height: 900px;
      border: 0;
      transform-origin: top left;
      transform: scale(0.2);
      pointer-events: none;
      background: #fff;
      display: block;
    }

    .card-body {
      padding: 16px 16px 14px;
      display: grid;
      gap: 10px;
      align-content: start;
      flex: 1;
    }

    .card-title {
      margin: 0;
      font-family: "Sora", "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.28;
      letter-spacing: -0.01em;
    }

    .file-name {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }

    .meta {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      border-radius: 999px;
      border: 1px solid #d8cebb;
      background: #f9f1e4;
      color: #4e5e6f;
      font-size: 12px;
      font-weight: 700;
      padding: 0 10px;
    }

    .actions {
      margin-top: 2px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      height: 38px;
      border-radius: 10px;
      border: 1px solid #c8c0b4;
      background: #fff;
      color: #3b4b5a;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 160ms ease;
    }

    .btn:hover {
      border-color: #a99b84;
      background: #faf6ee;
    }

    .btn.primary {
      border-color: #0a5d69;
      background: #0a5d69;
      color: #f0fbff;
    }

    .btn.primary:hover {
      background: #0b4e58;
      border-color: #0b4e58;
    }

    .empty {
      border-radius: var(--radius-lg);
      border: 1px dashed #c7b99f;
      background: #fffaf2;
      padding: 26px;
      text-align: center;
      color: #5f6f7d;
      font-weight: 600;
    }

    @media (max-width: 940px) {
      body {
        padding: 16px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .stats {
        justify-self: start;
      }

      .search-wrap {
        grid-template-columns: 1fr;
      }

      .small-note {
        text-align: left;
        padding: 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hero">
      <div>
        <h1>Project Page Index</h1>
        <p>Browse every prototype page in this project. Use search and category filters, then open directly with a live thumbnail preview.</p>
      </div>
      <div id="stats" class="stats">0 pages</div>
    </header>

    <section class="toolbar" aria-label="Page filters">
      <div class="search-wrap">
        <input id="searchInput" class="search" type="search" placeholder="Search by file name or page title..." autocomplete="off">
        <div class="small-note">Click a card to jump straight into that page.</div>
      </div>
      <div id="categoryChips" class="chips"></div>
    </section>

    <main id="grid" class="grid" aria-live="polite"></main>
  </div>

  <script>
    (function () {
      const pages = [
        ".edge_click_dump.html",
        ".edge_dump.html",
        "0.trees.html",
        "1.html",
        "1.terminalmanage.html",
        "10.customer_app_upload_manage.html",
        "11.transaction_detail_redesign.html",
        "12.transaction_list.html",
        "13.remote_control.html",
        "14.prepaid_card_list.html",
        "15.prepaid_card_activation.html",
        "16.prepaid_credit_adjustment.html",
        "17.prepaid_loss_replacement.html",
        "18.prepaid_terminal_activity.html",
        "19.prepaid_card_detail.html",
        "20.provider_custom_email_service.html",
        "2.agent_list_iso.html",
        "2.resellermerchantterminal.html",
        "260227-lead.html",
        "260227-lead_single_page.html",
        "3.pushtemplate.html",
        "3.pushtemplate_new.html",
        "3.version_provider_assign.html",
        "4.Select Application.html",
        "5.merchant_add_device_iso.html",
        "5.merchant_add_iso.html",
        "5.merchant_add_merchant_only_iso.html",
        "5.merchant_detail_iso.html",
        "5.merchant_device_settings_iso.html",
        "5.merchant_manage_iso.html",
        "6.edit_application_parameters.html",
        "7.merchant_contact.html",
        "8.splitbill.html",
        "9.trans.html",
        "Configure Integration.html",
        "Integration Dashboard.html",
        "Manage Documentation Links.html",
        "bill Setup 2.html",
        "bill Setup.html",
        "branding.html",
        "configure_terminal.html",
        "maintain_terminal_log.html",
        "merchant Bill.html",
        "merchant_Portal.html",
        "opc_log.html",
        "paywizard APP.html",
        "pushtask.html",
        "receipt History.html",
        "tmp.html",
        "tmp2.html"
      ];

      const PREVIEW_WIDTH = 1366;
      const PREVIEW_HEIGHT = 900;
      const state = {
        query: "",
        category: "All"
      };

      const grid = document.getElementById("grid");
      const searchInput = document.getElementById("searchInput");
      const categoryChips = document.getElementById("categoryChips");
      const stats = document.getElementById("stats");
      let previewObserver = null;

      function titleFromFile(file) {
        return file
          .replace(/\.html$/i, "")
          .replace(/[._-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/\b([a-z])/g, function (_, c) { return c.toUpperCase(); });
      }

      function classify(file) {
        const name = file.toLowerCase();
        if (name.includes("transaction") || name.includes("trans")) return "Transactions";
        if (name.includes("prepaid")) return "Prepaid Cards";
        if (name.includes("merchant")) return "Merchant";
        if (name.includes("terminal") || name.includes("device")) return "Terminal & Device";
        if (name.includes("push") || name.includes("app")) return "Push & App";
        if (name.includes("integration") || name.includes("documentation")) return "Integration";
        if (name.startsWith(".edge") || name.startsWith("tmp")) return "Scratch";
        return "General";
      }

      function toUrl(file) {
        return encodeURI(file);
      }

      function filteredPages() {
        const q = state.query.trim().toLowerCase();
        return pages
          .map(function (file) {
            return {
              file: file,
              title: titleFromFile(file),
              category: classify(file),
              url: toUrl(file)
            };
          })
          .filter(function (page) {
            if (state.category !== "All" && page.category !== state.category) return false;
            if (!q) return true;
            return (page.file + " " + page.title).toLowerCase().includes(q);
          })
          .sort(function (a, b) {
            return a.file.localeCompare(b.file, undefined, { numeric: true, sensitivity: "base" });
          });
      }

      function renderCategoryChips() {
        const categories = ["All"].concat(
          Array.from(
            new Set(
              pages
                .map(classify)
                .sort(function (a, b) { return a.localeCompare(b); })
            )
          )
        );

        categoryChips.innerHTML = categories
          .map(function (name) {
            const active = name === state.category ? " active" : "";
            return '<button class="chip' + active + '" type="button" data-category="' + name + '">' + name + "</button>";
          })
          .join("");
      }

      function renderGrid() {
        const rows = filteredPages();
        stats.textContent = rows.length + (rows.length === 1 ? " page" : " pages");

        if (!rows.length) {
          grid.innerHTML = '<div class="empty">No page matched your search/filter. Try a broader keyword.</div>';
          return;
        }

        grid.innerHTML = rows
          .map(function (page) {
            return (
              '<article class="page-card">' +
                '<div class="preview" data-preview-src="' + page.url + '">' +
                  '<span class="preview-status">Live Preview</span>' +
                  '<iframe class="preview-frame" title="Preview: ' + page.title + '" loading="lazy"></iframe>' +
                '</div>' +
                '<div class="card-body">' +
                  '<h2 class="card-title">' + page.title + '</h2>' +
                  '<p class="file-name">' + page.file + '</p>' +
                  '<p class="meta"><span class="meta-pill">' + page.category + '</span></p>' +
                  '<div class="actions">' +
                    '<a class="btn primary" href="' + page.url + '">Open</a>' +
                    '<a class="btn" href="' + page.url + '" target="_blank" rel="noopener">New Tab</a>' +
                  '</div>' +
                "</div>" +
              "</article>"
            );
          })
          .join("");

        hydratePreviews();
      }

      function fitPreviewScales() {
        const boxes = grid.querySelectorAll(".preview");
        boxes.forEach(function (box) {
          const frame = box.querySelector("iframe");
          if (!frame) return;
          const scale = Math.min(box.clientWidth / PREVIEW_WIDTH, box.clientHeight / PREVIEW_HEIGHT);
          frame.style.transform = "scale(" + scale + ")";
        });
      }

      function hydratePreviews() {
        if (previewObserver) previewObserver.disconnect();

        previewObserver = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              const box = entry.target;
              const frame = box.querySelector("iframe");
              if (frame && !frame.src) {
                frame.src = box.getAttribute("data-preview-src") || "";
              }
              previewObserver.unobserve(box);
            });
          },
          { rootMargin: "300px 0px", threshold: 0.01 }
        );

        grid.querySelectorAll(".preview").forEach(function (box) { previewObserver.observe(box); });
        fitPreviewScales();
      }

      categoryChips.addEventListener("click", function (event) {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.getAttribute("data-category") || "All";
        renderCategoryChips();
        renderGrid();
      });

      searchInput.addEventListener("input", function () {
        state.query = searchInput.value || "";
        renderGrid();
      });

      window.addEventListener("resize", fitPreviewScales);

      renderCategoryChips();
      renderGrid();
    })();
  </script>
</body>
</html>
