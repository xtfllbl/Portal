<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Details</title>
  <link rel="stylesheet" href="styles/na-theme.css">
  <link rel="stylesheet" href="styles/related-transactions.css">
  <link rel="stylesheet" href="styles/payment-brands.css">
  <style>
    :root{--bg:#f5f7fb;--line:#e5e7eb;--muted:#64748b;--ink:#0f172a;--soft:#f8fafc;--blue:#1d4ed8;--bluebg:#eff6ff;--ok:#166534;--okbg:#dcfce7;--dark:#0f0f10}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--pw-shell-bg,#f5f5f6);color:var(--ink)}
    .top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand,.user{display:flex;align-items:center;gap:10px}.logo,.avatar,.ib{display:grid;place-items:center}.logo{width:28px;height:28px;border-radius:6px;background:#111;color:#fff;font:700 13px/1 inherit}.ib{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative}.ib b{position:absolute;right:4px;top:4px;background:#111;color:#fff;border-radius:8px;padding:0 5px;font-size:10px;line-height:16px}.user{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}.avatar{width:24px;height:24px;border-radius:50%;background:#111;color:#fff;font-size:12px}
    .shell{display:flex;gap:20px;padding:20px;min-height:calc(100vh - 56px)}.side{width:250px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.08);padding:16px}.shead{padding:2px 4px 12px;border-bottom:1px solid var(--line)}.shead strong{display:block;font-size:17px}.shead span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.menu{display:grid;gap:4px;padding-top:10px}.mi,.si{display:block;text-decoration:none;color:inherit}.mi{padding:9px 12px;border-radius:10px;font-weight:700}.mi.active{background:#111;color:#fff}.si{margin-left:18px;padding:7px 12px;border-radius:999px;color:var(--muted);font-size:13px}.si.active{background:#111;color:#fff}
    .work{flex:1;min-width:0}.wrap{width:100%;max-width:none;margin:0}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--pw-page-radius,8px);box-shadow:var(--shadow-xs)}.hero{display:block}.maincard{padding:20px}.k{display:none}h1,h2,h3,p{margin:0}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.head h1{font-size:25px;font-weight:600;color:#44464d;line-height:1.2;letter-spacing:-.01em}.head p{display:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:700;white-space:nowrap}.chip.ok{background:var(--okbg);border-color:#bbf7d0;color:var(--ok)}.chip.neu{background:#eef2f7;border-color:#dbe1ea;color:#334155}.chip.info{background:var(--bluebg);border-color:#bfdbfe;color:var(--blue)}.topactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .sum{margin-top:18px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:stretch}.amt{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px;border-radius:var(--pw-page-radius,8px);border:1px solid #dbe3ef;background:linear-gradient(180deg,#ffffff 0%,#edf4ff 100%);box-shadow:0 18px 32px rgba(29,78,216,.08)}.amt .kk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.amt strong{display:block;margin-top:22px;font-size:62px;font-weight:700;line-height:.92;letter-spacing:-.07em;white-space:nowrap;overflow-wrap:normal;font-variant-numeric:tabular-nums}.amt strong.amount-long{font-size:50px;letter-spacing:-.06em}.amt strong.amount-xlong{font-size:40px;letter-spacing:-.045em}.amt strong.amount-xxlong{font-size:34px;letter-spacing:-.035em}.amt .meta{margin-top:20px;padding-top:16px;border-top:1px solid #dbe3ef}.amt .chips{margin-top:0}.key-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.summary-card{min-height:92px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--pw-page-radius,8px);background:#fff}.summary-card span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.summary-card strong{display:block;margin-top:10px;font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}.summary-card .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.terminal-link{color:#1d4ed8;text-decoration:none;border-bottom:1px solid transparent;font-weight:600;transition:color .16s ease,border-color .16s ease}.terminal-link:hover{color:#1e40af;border-bottom-color:currentColor}.terminal-link:focus-visible{outline:2px solid #93c5fd;outline-offset:2px;border-radius:3px;border-bottom-color:transparent}.transaction-switch-notice{position:fixed;top:22px;left:calc(50% + 145px);z-index:100;width:max-content;min-width:310px;max-width:calc(100vw - 330px);display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border:0;border-radius:8px;background:#202124;color:#f8fafc;box-shadow:0 8px 22px rgba(15,23,42,.24);font-size:13px;line-height:1.5;opacity:0;pointer-events:none;transform:translate(-50%,calc(-100% - 24px));transition:opacity .18s ease,transform .34s cubic-bezier(.22,1,.36,1)}.transaction-switch-notice strong{color:#fff;font-weight:600;overflow-wrap:anywhere}.transaction-switch-notice.show{opacity:1;transform:translate(-50%,0)}.transaction-switch-notice[hidden]{display:none}@media (max-width:1180px){.transaction-switch-notice{left:50%;max-width:calc(100vw - 40px)}}@media (prefers-reduced-motion:reduce){.transaction-switch-notice{transition:none}}
    .transaction-detail-page .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none}.transaction-detail-page .btn:hover{color:var(--ink);text-decoration:none;background:#f8fafc}.transaction-detail-page .btn.dark{background:#29292c;color:#fff;border-color:#29292c}.transaction-detail-page .btn.dark:hover{background:#111;color:#fff}.transaction-detail-page .btn-icon{width:18px;height:18px;flex:0 0 18px}
    #sections{margin-top:14px;display:grid;gap:12px}.kv{display:grid;gap:8px}.kvrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:13px;line-height:1.4}.kvrow span{color:var(--muted)}.kvrow strong{font-size:13px;font-weight:500;line-height:1.4;letter-spacing:0;text-align:right;word-break:break-word;font-family:inherit}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.more{padding:20px}.more summary{cursor:pointer;list-style:none;font-size:16px;font-weight:600}.more summary::-webkit-details-marker{display:none}.more-grid{display:grid;gap:12px;margin-top:0}.top-transaction{grid-column:1 / -1}.tx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-inline:-17px}.tx-col{position:relative;display:grid;align-content:start;padding-inline:17px;min-width:0}.tx-col+.tx-col::before{content:"";position:absolute;top:0;bottom:0;left:-6.5px;width:1px;background:#e8eef6}.more-bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mini{padding:16px;border:1px solid var(--line);border-radius:var(--pw-page-radius,8px);background:#fff}.mini h4{margin:0 0 12px;font-size:14px;font-weight:600;line-height:1.4}.mini .kv{gap:7px}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.mp{width:min(860px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 70px rgba(15,23,42,.28)}.mp.bill-panel{width:min(1280px,100%);height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}.mp.send-panel{width:min(560px,100%)}.mh{padding:18px 20px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.mh h3{margin:0;font-size:20px;font-weight:600;line-height:1.4}.mh p{margin-top:4px;font-size:13px;color:var(--muted)}.x{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:18px;cursor:pointer}.bill-view{flex:1;overflow:auto;padding:22px 40px 0}.bill-canvas{min-height:100%;display:flex;justify-content:center;align-items:flex-start;background:#fff}.bill-image{width:min(760px,100%);min-height:980px;padding:34px 38px 58px;border:2px solid #d6dae1;background:#fff;box-shadow:0 0 0 1px rgba(148,163,184,.08)}.bill-print{font-family:"Courier New",Consolas,monospace;color:#111827;letter-spacing:.01em}.print-center{text-align:center}.print-title{font-size:30px;line-height:1.2;margin-bottom:28px}.print-grid{display:grid;gap:14px;font-size:22px;line-height:1.35}.print-row{display:flex;justify-content:space-between;gap:28px}.print-row span:last-child{text-align:right}.print-spacer{height:40px}.print-total{display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:center;font-size:36px;line-height:1.2;margin:28px 0 26px}.print-rule{font-size:34px;letter-spacing:.18em;margin:8px 0}.print-copy{font-size:34px;font-weight:700;margin-top:34px}.print-note{margin-top:26px;font-size:22px}.print-brand{margin-top:40px;font-size:34px}.mf{padding:0 20px 20px;display:flex;justify-content:flex-end;gap:10px}.bill-actions{padding:18px 40px 38px}.send-body{padding:20px;display:grid;gap:18px}.form-grid{display:grid;gap:16px}.field{display:grid;gap:8px}.field label{font-size:12px;font-weight:500;color:var(--pw-shell-muted,#727783);margin:0}.input{width:100%;height:40px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}.input:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(59,130,246,.12)}.input[readonly]{background:#f8fafc;color:#475569;cursor:not-allowed}.field p{display:none;margin:0;font-size:12px;line-height:1.5;color:var(--muted)}.field.error .input{border-color:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.12)}.field.error p{display:block;color:#b91c1c}
    .toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:8px;background:#29292c;color:#fff;box-shadow:0 18px 40px rgba(15,23,42,.26);font-size:13px;font-weight:700;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .18s,transform .18s;z-index:30}.toast.show{opacity:1;transform:translateY(0)}
    @media (max-width:1180px){.shell{flex-direction:column}.side{width:100%}.sum{grid-template-columns:320px minmax(0,1fr)}.key-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:980px){.sum,.tx-grid{grid-template-columns:1fr}.tx-grid{margin-inline:0}.tx-col{padding-inline:0}.tx-col+.tx-col{padding-top:12px;margin-top:12px;border-top:1px solid #e8eef6}.tx-col+.tx-col::before{display:none}.more-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.key-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.amt strong{font-size:48px}.mp.bill-panel{height:calc(100vh - 24px)}.bill-view{padding-left:20px;padding-right:20px}.bill-actions{padding:18px 20px 24px}.bill-image{min-height:860px;padding:28px 22px 44px}.print-grid{font-size:18px}.print-total{font-size:28px}.print-title,.print-copy,.print-brand{font-size:28px}.print-rule{font-size:28px}}@media (max-width:720px){.shell{padding:14px;gap:14px}.maincard,.more{padding:16px}.head{flex-direction:column}.head h1{font-size:25px}.topactions{width:100%}.topactions .btn{flex:1 1 auto}.key-grid{grid-template-columns:1fr}.more-bottom{grid-template-columns:1fr}.amt{padding:20px}.amt strong{font-size:48px}.mf{flex-direction:column}.mh,.mf{padding-left:16px;padding-right:16px}.bill-view{padding:16px 16px 0}.bill-actions{padding:16px}.bill-image{min-height:720px}.print-grid{font-size:15px;gap:12px}.print-total{font-size:22px;gap:14px}.print-title,.print-copy,.print-brand{font-size:24px}.print-note{font-size:16px}.print-rule{font-size:22px}}
    .chip.result.completed{background:var(--okbg);border-color:#bbf7d0;color:var(--ok)}.chip.result.failed{background:#fee2e2;border-color:#fecaca;color:#991b1b}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/platform-admin-shell.css">
</head>
<body class="transaction-detail-page">
  <header class="top">
    <div class="brand"><div class="logo">PW</div><div>Paywizard Console</div></div>
    <div class="brand">
      <button class="ib" aria-label="Notifications">!<b>5</b></button>
      <button class="ib" aria-label="Settings">*</button>
      <div class="user"><div class="avatar">R</div><span>robasz</span></div>
    </div>
  </header>
  <div class="shell">
    <aside class="side">
      <div class="shead"><strong>PAYwizard</strong><span>menu</span></div>
      <nav class="menu">
        <a class="mi" href="#">Dashboard</a>
        <a class="mi active" href="#">Transactions</a>
        <a class="si" href="9.trans.html">All Transactions</a>
        <a class="si active" href="11.transaction_detail_redesign.html">Transaction Details</a>
        <a class="si" href="receipt History.html">Receipt History</a>
        <a class="mi" href="#">Agents</a>
        <a class="mi" href="#">Merchants</a>
        <a class="mi" href="#">Device Management</a>
        <a class="mi" href="#">User Management</a>
        <a class="mi" href="#">Settings</a>
      </nav>
    </aside>
    <div class="work">
      <div class="wrap">
        <section class="hero">
          <section class="card maincard">
            <div class="head">
              <div>
                <h1>Transaction Details</h1>
              </div>
              <div class="topactions">
                <a class="btn back" id="backToTransactionsBtn" href="12.transaction_list.html"><img class="btn-icon" src="assets/icons/arrow-circle-left.svg" alt="">Back</a>
                <button class="btn" id="viewReceiptBtn" type="button"><img class="btn-icon" src="assets/icons/receipt_long.svg" alt="">View Receipt</button>
                <button class="btn" id="sendReceiptBtn" type="button"><img class="btn-icon" src="assets/icons/send.svg" alt="">Send Receipt</button>
              </div>
            </div>
            <div class="sum" aria-live="polite"></div>
          </section>
        </section>
        <section class="card" id="relatedTransactions" aria-labelledby="relatedTitle"><h2 id="relatedTitle">Related Transactions</h2><div class="pw-related-content"></div></section>
        <div id="sections"></div>
      </div>
    </div>
  </div>
  <div class="transaction-switch-notice" id="transactionSwitchNotice" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <div class="modal" id="receiptModal" aria-hidden="true">
    <div class="mp bill-panel">
      <div class="mh">
        <div><div class="k">Receipt Image</div><h3>Receipt Image</h3></div>
      </div>
      <div class="bill-view">
        <div class="bill-canvas">
          <div class="bill-image">
            <div class="bill-print"></div>
          </div>
        </div>
      </div>
      <div class="mf bill-actions">
        <button class="btn" id="cancelReceiptBtn" type="button">Cancel</button>
        <button class="btn dark" type="button" data-toast="Receipt download started.">Download</button>
      </div>
    </div>
  </div>
  <div class="modal" id="sendReceiptModal" aria-hidden="true">
    <div class="mp send-panel">
      <div class="mh">
        <div>
          <div class="k">Send Receipt</div>
          <h3>Send Receipt</h3>
        </div>
        <button class="x" id="closeSendReceiptBtn" type="button" aria-label="Close"><img src="assets/icons/close.svg" width="18" height="18" alt=""></button>
      </div>
      <div class="send-body">
        <div class="form-grid">
          <div class="field">
            <label for="transactionReceiptEmail">Transaction Email</label>
            <input class="input" id="transactionReceiptEmail" type="text" readonly>
          </div>
          <div class="field" id="sendReceiptFieldWrap">
            <label for="sendReceiptEmail">Send To</label>
            <input class="input" id="sendReceiptEmail" type="email" autocomplete="email">
            <p id="sendReceiptError"></p>
          </div>
        </div>
      </div>
      <div class="mf">
        <button class="btn" id="cancelSendReceiptBtn" type="button">Cancel</button>
        <button class="btn dark" id="confirmSendReceiptBtn" type="button">Send Receipt</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Done</div>

  <script src="scripts/payment-brands.js"></script>
  <script src="scripts/transaction-records.js"></script>
  <script src="scripts/related-transactions.js"></script>
  <script src="scripts/transaction-detail-model.js"></script>
  <script src="scripts/transaction-detail.js"></script>
  <script src="scripts/platform-admin-shell.js"></script>
</body>
</html>
