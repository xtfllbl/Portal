<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Detail | PAYwizard Maintain</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/platform-admin-shell.css">
  <link rel="stylesheet" href="styles/payment-channel-maintain.css">
  <style>
    .log-facts { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; font-size: 12px; }
    .log-facts div { display: grid; gap: 6px; }
    .log-facts dt { color: #727783; }
    .log-facts dd { margin: 0; }
    .log-content { padding: 20px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f7f8fa; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="main-content pc-page">
    <header class="pc-heading">
      <div class="pw-page-title-with-back">
        <a class="pw-page-back-button" href="24.maintain_terminal_log.html" aria-label="Back to Terminal Logs" title="Back to Terminal Logs"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span></a>
        <h1>Log Detail</h1>
      </div>
    </header>
    <dl class="log-facts">
      <div><dt>Date &amp; Time</dt><dd data-log="time"></dd></div>
      <div><dt>S/N</dt><dd data-log="sn"></dd></div>
      <div><dt>Exception Level</dt><dd data-log="level"></dd></div>
      <div><dt>Title</dt><dd data-log="title"></dd></div>
    </dl>
    <pre class="log-content" aria-label="Log content"></pre>
  </main>
  <script src="scripts/platform-admin-shell.js"></script>
  <script>
    (function () {
      var query = new URLSearchParams(location.search);
      var record = { sn: query.get('sn') || 'WP2013Q321000014', timestamp: query.get('time') || '2025-10-17 13:51:02', level: query.get('level') || 'critical', title: query.get('title') || 'MDB ERROR', stage: 'terminal_upload' };
      ['sn', 'level', 'title'].forEach(function (key) { document.querySelector('[data-log="' + key + '"]').textContent = record[key]; });
      document.querySelector('[data-log="time"]').textContent = record.timestamp;
      document.querySelector('.log-content').textContent = JSON.stringify(record, null, 2);
    })();
  </script>
</body>
</html>
