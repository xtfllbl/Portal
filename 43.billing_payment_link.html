<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pay your bill | PAYwizard</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles/billing-checkout.css"></head>
<body><main class="checkout-shell">
<section class="bill-summary" aria-label="Billing information"><div class="checkout-brand"><span class="checkout-wordmark"><img src="assets/paywizard-logo-sidebar.png" alt="PAYwizard"></span></div>
<div id="billInformation"><h1>Loading bill…</h1></div></section>
<section class="checkout-payment" aria-label="Payment"><p id="pageError" role="alert" hidden></p><div id="pageLoading" role="status">Loading payment details…</div>
<form id="cardForm" autocomplete="off" hidden>
<h2>Contact information</h2><label class="field">Email<input id="cardEmail" type="email" placeholder="email@example.com" maxlength="254" required></label>
<h2>Payment method</h2><div class="payment-method"><div class="card-heading"><span class="material-symbols-rounded" aria-hidden="true">radio_button_checked</span><span class="material-symbols-rounded" aria-hidden="true">credit_card</span><strong>Card</strong></div>
<label class="field card-information">Card information<span class="card-number-field"><input id="cardNumber" inputmode="numeric" placeholder="1234 1234 1234 1234" aria-label="Card number" maxlength="23" required><span class="card-brands"><img src="assets/payment-brands/visa.svg" alt="Visa"><img src="assets/payment-brands/mastercard.svg" alt="Mastercard"></span></span></label>
<div class="card-pair"><label><span class="sr-only">Expiry date</span><input id="cardExpiry" inputmode="numeric" placeholder="MM / YY" maxlength="7" required></label><label><span class="sr-only">CVC</span><input id="cardCvc" type="password" inputmode="numeric" placeholder="CVC" pattern="[0-9]{3,4}" maxlength="4" required></label></div>
<label class="field">Cardholder name<input id="cardholder" placeholder="Full name on card" required maxlength="100"></label>
<label class="field">Country or region<select id="cardCountry" required><option value="SG">Singapore</option><option value="CN">China</option><option value="US">United States</option><option value="CA">Canada</option><option value="GB">United Kingdom</option><option value="DE">Germany</option><option value="FR">France</option></select></label></div>
<div id="chargeSummary" class="charge-summary"></div>
<label id="recurringAuthorization" class="recurring-authorization" hidden><input id="recurringConsent" type="checkbox"><span id="recurringConsentText"></span></label>
<div class="card-agreements"><label><input type="checkbox" required><span>I agree to the <strong>Terms of Service</strong>, <strong>Privacy Policy</strong> and <strong>Refund Policy</strong>.</span></label></div>
<p id="cardError" role="alert" hidden></p><button id="submitCard" type="submit" disabled>Pay</button>
</form>
<div id="paymentResult" hidden aria-live="polite"></div>
<footer>Powered by PAYwizard</footer>
</section></main><script src="scripts/billing-card-form.js"></script><script src="scripts/billing-checkout.js"></script></body></html>
