<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Matrix | PAYwizard Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/platform-admin-shell.css">
  <link rel="stylesheet" href="styles/terminal-uptime.css">
<link rel="stylesheet" href="styles/operating-hours-editor.css">
</head>
<body>
<main class="uptime-page" id="uptimeApp">
  <header class="up-heading"><div class="up-title"><h1>Uptime Matrix</h1></div><div class="up-actions"><button id="manageHours" class="up-primary" type="button"><span class="material-symbols-rounded" aria-hidden="true">schedule</span>Operating Hours</button></div></header>
  <div id="uptimeError" class="up-error" role="alert" tabindex="-1" hidden></div>
  <form class="up-filters" id="uptimeFilters" aria-label="Uptime filters" novalidate>
    <div id="organizationField"><div id="organizationPicker"></div></div>
    <div id="storePicker"></div>
    <input type="search" id="terminalSearch" placeholder="Name or S/N" aria-label="Terminal name or S/N" autocomplete="off">
    <div id="statusPicker"></div>
    <button id="uptimeRange" class="up-range-trigger" type="button" aria-label="Date range" aria-haspopup="dialog" aria-expanded="false" popovertarget="uptimeCalendar"><span id="uptimeRangeLabel"></span><span class="material-symbols-rounded" aria-hidden="true">calendar_today</span></button>
    <button id="uptimeSearch" class="up-primary up-icon" type="submit" aria-label="Search uptime" title="Search"><span class="material-symbols-rounded" aria-hidden="true">search</span></button>
    <div id="uptimeCalendar" class="up-calendar" popover role="dialog" aria-label="Select a seven-day range">
      <div class="up-calendar-heading"><button id="uptimeMonthPrevious" type="button" aria-label="Previous month"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button><strong id="uptimeMonth" aria-live="polite"></strong><button id="uptimeMonthNext" type="button" aria-label="Next month"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button></div>
      <p class="up-calendar-hint">Select the last day · 7 days</p>
      <div class="up-calendar-weekdays" aria-hidden="true"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
      <div id="uptimeCalendarDays" class="up-calendar-days" role="group" aria-label="End date"></div>
      <div id="uptimeCalendarRange" class="up-calendar-range" aria-live="polite"></div>
    </div>
  </form>
  <section class="up-matrix-panel" aria-label="Payment Service uptime">
    <div class="up-legend" aria-label="Matrix legend"><span><i class="up-key online"></i>≥95%</span><span><i class="up-key warning"></i>90–&lt;95%</span><span><i class="up-key offline"></i>&lt;90%</span><span><i class="up-key closed"></i>Outside hours</span><span><i class="up-key unavailable"></i>No data</span><span class="up-meta" id="uptimeUpdated"></span></div>
    <div class="up-matrix-scroll" tabindex="0" aria-label="Terminal daily uptime matrix"><table class="up-matrix"><thead id="uptimeHead"></thead><tbody id="uptimeRows"></tbody></table></div>
    <div id="uptimeEmpty" class="up-empty" hidden>No terminal history in this date range.</div>
    <footer class="up-table-footer"><span id="uptimePageInfo"></span><span class="up-meta" id="uptimeCount"></span><div class="up-actions"><button id="previousPage" class="up-icon" type="button" aria-label="Previous page"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button><button id="nextPage" class="up-icon" type="button" aria-label="Next page"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button></div></footer>
  </section>
</main>
<dialog class="up-dialog up-drawer" id="uptimeDayDialog" aria-labelledby="uptimeDayTitle">
  <header class="up-dialog-heading"><h2 id="uptimeDayTitle">Payment Service</h2><button class="up-icon" type="button" data-close="uptimeDayDialog" aria-label="Close daily details"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></header>
  <div class="up-dialog-body" id="uptimeDayContent"></div>
  <footer class="up-dialog-footer"><button type="button" id="dayPrevious" aria-label="Previous available day"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>Previous day</button><button type="button" id="dayNext" aria-label="Next available day">Next day<span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button><button type="button" id="dayHours" class="up-primary">Operating Hours</button></footer>
</dialog>
<script src="scripts/platform-admin-shell.js"></script>
<script src="scripts/customer-account-data.js"></script>
<script src="scripts/customer-account-directory.js"></script>
<script src="scripts/terminal-uptime-domain.js"></script>
<script src="scripts/terminal-uptime-store.js"></script>
<script src="scripts/terminal-uptime-view.js"></script>
<script src="scripts/uptime-combobox.js"></script>
<script src="scripts/uptime-week-picker.js"></script>
<script src="scripts/operating-hours-editor.js"></script>
<script src="scripts/terminal-uptime.js"></script>
</body>
</html>
