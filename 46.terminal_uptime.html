<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Matrix | PAYwizard Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/platform-admin-shell.css">
  <link rel="stylesheet" href="styles/terminal-uptime.css">
</head>
<body>
<main class="uptime-page" id="uptimeApp">
  <header class="up-heading"><div class="up-title"><h1>Uptime Matrix</h1><span class="up-badge">Simulated data</span></div><div class="up-actions"><button id="refreshUptime" type="button"><span class="material-symbols-rounded" aria-hidden="true">refresh</span>Refresh</button><button id="manageHours" class="up-primary" type="button"><span class="material-symbols-rounded" aria-hidden="true">schedule</span>Operating Hours</button></div></header>
  <div id="uptimeError" class="up-error" role="alert" tabindex="-1" hidden></div>
  <div class="up-filters" id="uptimeFilters">
    <label id="organizationField">Organization<div id="organizationPicker"></div></label>
    <label>Store<div id="storePicker"></div></label>
    <label>Terminal<input type="search" id="terminalSearch" placeholder="Search name or S/N" autocomplete="off"></label>
    <label>Show<div id="statusPicker"></div></label>
  </div>
  <section class="up-matrix-panel" aria-label="Payment Service uptime">
    <div class="up-range-bar"><div class="up-date-navigation"><button id="previousWeek" class="up-icon" type="button" aria-label="Previous 7 days"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button><label class="up-date-field"><span class="up-sr">Start date</span><input type="date" id="uptimeStart" aria-label="Start date"></label><span aria-hidden="true">–</span><label class="up-date-field"><span class="up-sr">End date</span><input type="date" id="uptimeEnd" aria-label="End date"></label><button id="nextWeek" class="up-icon" type="button" aria-label="Next 7 days"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button><button id="recentWeek" type="button">Last 7 days</button></div><span id="uptimeUpdated" class="up-meta"></span></div>
    <div class="up-legend" aria-label="Matrix legend"><span><i class="up-key online"></i>Online</span><span><i class="up-key offline"></i>Downtime</span><span><i class="up-key unknown"></i>Missing data</span><span><i class="up-key closed"></i>Outside operating hours</span><span class="up-meta" id="uptimeCount"></span></div>
    <div class="up-matrix-scroll" tabindex="0" aria-label="Terminal daily uptime matrix"><table class="up-matrix"><thead id="uptimeHead"></thead><tbody id="uptimeRows"></tbody></table></div>
    <div id="uptimeEmpty" class="up-empty" hidden>No terminal history in this date range.</div>
    <footer class="up-table-footer"><span id="uptimePageInfo"></span><div class="up-actions"><button id="previousPage" class="up-icon" type="button" aria-label="Previous page"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button><button id="nextPage" class="up-icon" type="button" aria-label="Next page"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button></div></footer>
  </section>
</main>
<dialog class="up-dialog up-drawer" id="uptimeDayDialog" aria-labelledby="uptimeDayTitle">
  <header class="up-dialog-heading"><h2 id="uptimeDayTitle">Payment Service</h2><button class="up-icon" type="button" data-close="uptimeDayDialog" aria-label="Close daily details"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></header>
  <div class="up-dialog-body" id="uptimeDayContent"></div>
  <footer class="up-dialog-footer"><button type="button" id="dayPrevious" aria-label="Previous available day"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>Previous day</button><button type="button" id="dayNext" aria-label="Next available day">Next day<span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button><button type="button" id="dayHours" class="up-primary">Operating Hours</button></footer>
</dialog>
<dialog class="up-dialog up-hours-dialog" id="operatingHoursDialog" aria-labelledby="hoursTitle">
  <form id="operatingHoursForm" novalidate>
    <header class="up-dialog-heading"><h2 id="hoursTitle">Operating Hours</h2><button class="up-icon" type="button" data-close="operatingHoursDialog" aria-label="Close Operating Hours"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></header>
    <div class="up-dialog-body">
      <label class="up-field">Store or terminal<div id="hoursTargetPicker"></div></label>
      <div id="hoursMode" class="up-mode-row"></div>
      <div id="hoursFields"></div>
      <section class="up-preview"><h3>Effective hours</h3><div id="hoursPreview"></div></section>
      <details class="up-history"><summary id="hoursHistoryTitle">Change history</summary><div id="hoursHistory"></div></details>
      <p class="up-error" id="hoursError" role="alert" tabindex="-1" hidden></p>
    </div>
    <footer class="up-dialog-footer"><span id="hoursImpact" class="up-impact"></span><div class="up-actions"><button type="button" data-close="operatingHoursDialog">Cancel</button><button type="submit" class="up-primary" id="saveOperatingHours">Save</button></div></footer>
  </form>
</dialog>
<div id="uptimeToast" class="up-toast" role="status" hidden></div>
<script src="scripts/platform-admin-shell.js"></script>
<script src="scripts/customer-account-data.js"></script>
<script src="scripts/customer-account-directory.js"></script>
<script src="scripts/terminal-uptime-domain.js"></script>
<script src="scripts/terminal-uptime-store.js"></script>
<script src="scripts/uptime-combobox.js"></script>
<script src="scripts/terminal-uptime.js"></script>
</body>
</html>
