<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
body{font:13px/1.6 system-ui,sans-serif;color:#242428;margin:20px;background:#fff}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0;color:#606068}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{font:inherit;padding:8px 12px;border:1px solid #d9d9df;border-radius:6px;background:white;cursor:pointer}button.primary{background:#151517;color:white}button:disabled{opacity:.4;cursor:wait}#status{white-space:pre-wrap;background:#f5f5f7;padding:12px;border-radius:6px;max-height:160px;overflow:auto}textarea{width:100%;height:180px;box-sizing:border-box;font:11px/1.4 monospace;border:1px solid #ddd;margin-top:12px}#error{color:#b4232e;white-space:pre-wrap}.note{font-size:12px}
</style>
<h1>Billing 41–44 · 本地整理 <small>v1.1.0</small></h1>
<p>在新的副本画布生成 30 个可编辑画板。保留全部源画板，不调用 MCP，不访问外部网络。</p>
<div class="actions">
<button data-command="inspect">1. 检查源画板</button>
<button data-command="proof">2. 生成三个验证画板</button>
<button class="primary" data-command="build">3. 整理全部 30 个画板</button>
<button data-command="validate">4. 检查整理结果</button>
</div>
<div id="status" role="status">准备读取当前文件…</div><div id="error" role="alert"></div>
<div class="actions"><button id="report" disabled>下载检查报告 JSON</button><select id="frame"><option value="">选择画板</option></select><button id="preview" disabled>查看 / 导出 PNG</button></div>
<p class="note">验证画板为 41-03（日期）、44-07（遮罩与层级）、44-10（邮件）。结构检查通过不等于视觉验收通过。</p>
<textarea id="details" readonly aria-label="检查报告"></textarea>
<script>
let report=null,busy=false;
const $=id=>document.getElementById(id);
function send(command,extra={}){if(busy)return;parent.postMessage({pluginMessage:{command,...extra}},'*')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send(b.dataset.command));
$('report').onclick=()=>download(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),'paywizard-billing-local-report.json');
$('preview').onclick=()=>send('preview',{state:$('frame').value});
$('frame').onchange=()=>{$('preview').disabled=busy||!$('frame').value};
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;
 if(m.type==='busy'){busy=m.value;document.querySelectorAll('[data-command]').forEach(b=>b.disabled=busy);$('preview').disabled=busy||!$('frame').value;}
 if(m.type==='status'){$('status').textContent=m.text;$('error').textContent='';}
 if(m.type==='error'){$('error').textContent=m.text;}
 if(m.type==='report'){report=m.report;$('details').value=JSON.stringify(report,null,2);$('report').disabled=false;const old=$('frame').value;$('frame').replaceChildren(new Option('选择画板',''));(report.output||[]).forEach(f=>$('frame').add(new Option(f.state+' · '+f.name,f.state)));$('frame').value=old;}
 if(m.type==='image')download(new Blob([new Uint8Array(m.bytes)],{type:'image/png'}),m.name+'.png');
};
</script></html>
