<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Credentials</title>
    <style>
        /* Tailwind CSS */
        .bg-gray-100 {
            background-color: #f3f4f6;
        }
        .bg-white {
            background-color: #ffffff;
        }
        .bg-gray-50 {
            background-color: #f9fafb;
        }
        .bg-gray-200 {
            background-color: #e5e7eb;
        }
        .text-gray-500 {
            color: #6b7280;
        }
        .text-gray-600 {
            color: #4b5563;
        }
        .text-gray-800 {
            color: #1f2937;
        }
        .text-black {
            color: #000000;
        }
        .font-semibold {
            font-weight: 600;
        }
        .font-medium {
            font-weight: 500;
        }
        .font-bold {
            font-weight: 700;
        }
        .text-2xl {
            font-size: 1.5rem;
            line-height: 2rem;
        }
        .text-lg {
            font-size: 1.125rem;
            line-height: 1.75rem;
        }
        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }
        .mb-2 {
            margin-bottom: 0.5rem;
        }
        .mb-4 {
            margin-bottom: 1rem;
        }
        .mb-6 {
            margin-bottom: 1.5rem;
        }
        .px-2 {
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }
        .py-1 {
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }
        .px-8 {
            padding-left: 2rem;
            padding-right: 2rem;
        }
        .py-6 {
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }
        .p-8 {
            padding-left: 2rem;
            padding-right: 2rem;
        }
        .p-6 {
            padding: 1.5rem;
        }
        .border-b {
            border-bottom-width: 1px;
        }
        .border-t {
            border-top-width: 1px;
        }
        .border-gray-200 {
            border-color: #e5e7eb;
        }
        .rounded-lg {
            border-radius: 0.5rem;
        }
        .overflow-hidden {
            overflow: hidden;
        }
        .max-w-2xl {
            max-width: 42rem;
        }
        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }
        .grid {
            display: grid;
        }
        .grid-cols-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .gap-4 {
            gap: 1rem;
        }
        .col-span-1 {
            grid-column: span 1 / span 1;
        }
        .col-span-2 {
            grid-column: span 2 / span 2;
        }
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
            "Liberation Mono", "Courier New", monospace;
        }
        .h-8 {
            height: 2rem;
        }
    </style>
</head>
<body class="bg-gray-100">
<div class="max-w-2xl mx-auto bg-white rounded-lg overflow-hidden">
    <!-- Header -->
    <div class="bg-white py-6 px-8 border-b border-gray-200" style="border-bottom: 1px solid #e5e7eb;">
        <img
                src="https://objectstorage.us-phoenix-1.oraclecloud.com/n/cnzeb08gfxuj/b/paywizard_js/o/paywizard-logo.png"
                alt="Paywizard Logo"
                class="h-8"
        />
    </div>

    <!-- Content -->
    <div class="p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">
            Token Information
        </h1>

        <p class="text-gray-600 mb-6">
            Dear <span class="font-semibold">Developer</span>,
        </p>

        <p class="text-gray-600 mb-6">
            Your Paywizard developer merchant token has been created successfully. Below are the token information:
        </p>

        <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">
                Token Information
            </h2>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="col-span-1 text-gray-500">Client ID:</div>
                <div class="col-span-2 font-medium text-gray-800">${clientId}</div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1 text-gray-500">Plat ID:</div>
                <div class="col-span-2">
              <span class="bg-gray-200 px-2 py-1 font-mono text-sm"
              >${platId}</span
              >
                </div>
            </div>


            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1 text-gray-500">Token:</div>
                <div class="col-span-2">
              <span class="bg-gray-200 px-2 py-1 font-mono text-sm"
              >${token}</span
              >
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="bg-gray-50 px-8 py-6 border-t border-gray-200">
        <div class="text-sm text-gray-500">
            <p class="mb-2">© 2025 Paywizard. All rights reserved.</p>
            <p>
                <a href="#" style="color: #1b72ec;">Privacy Policy</a> |
                <a href="#" style="color: #1b72ec;">Terms of Service</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
