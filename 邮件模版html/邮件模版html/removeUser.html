<body style="background-color: #f3f4f6;">
<div style="max-width: 42rem; margin-left: auto; margin-right: auto; background-color: #ffffff; border-radius: 0.5rem; overflow: hidden;">
  <!-- Header -->
  <div style="background-color: #ffffff; padding-top: 1.5rem; padding-bottom: 1.5rem; padding-left: 2rem; padding-right: 2rem; border-bottom-width: 1px; border-color: #e5e7eb; border-bottom: 1px solid #e5e7eb;">

  </div>

  <!-- Content -->
  <div style="padding: 2rem;">
    <div style="background-color: #fef2f2; border-left-width: 4px; border-color: #f87171; padding: 1rem; margin-bottom: 1.5rem;">
      <div style="display: flex;align-items: center;">
        <div style="flex-shrink: 0;">
          <svg t="1742199723232" class="icon" viewBox="0 0 1026 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="11930" width="18" height="18"><path d="M1004.657 801.716 602.263 91.599c-49.213-86.817-129.646-86.817-178.866 0L21.004 801.716c-49.207 86.906-8.949 157.798 89.388 157.798l804.877 0C1013.606 959.514 1053.825 888.622 1004.657 801.716zM544.635 832.216l-63.649 0 0-63.649 63.649 0L544.635 832.216zM544.635 641.27l-63.649 0L480.986 259.377l63.649 0L544.635 641.27z" p-id="11931" fill="#d81e06"></path></svg>

        <div style="margin-left: 0.75rem;">

            Important Information
          </p>
        </div>
      </div>

      <h1 style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 1rem;">Account Deleted</h1>

      <p style="color: #4b5563; margin-bottom: 1.5rem;">
        Dear <span style="font-weight: 600;">User</span>,
      </p>

      <p style="color: #4b5563; margin-bottom: 1.5rem;">
        Your Paywizard account has been deleted. Below are the account information:
      </p>

      <div style="background-color: #f9fafb; border-width: 1px; border-color: #e5e7eb; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.125rem; font-weight: 600; color: #1f2937; margin-bottom: 1rem;">Account Information</h2>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1rem;">
          <div style="grid-column: span 1 / span 1; color: #6b7280;">Account Name:</div>
          <div style="grid-column: span 2 / span 2; font-weight: 500; color: #1f2937;">${loginName}</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="background-color: #f9fafb; padding-left: 2rem; padding-right: 2rem; padding-top: 1.5rem; padding-bottom: 1.5rem; border-top-width: 1px; border-color: #e5e7eb;">
