<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent List</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/platform-admin-shell.css">
  <link rel="stylesheet" href="styles/agent-list.css">
</head>
<body>
  <div class="app"><main class="main">
    <section class="content al-page">
      <div class="pw-module-page-header al-page-heading"><h1 class="pw-module-page-title">Agent List</h1><div class="al-provider-field"><label id="providerLabel">Service Provider</label><div id="providerPicker"></div></div></div>
      <div class="al-layout">
        <aside class="al-hierarchy" aria-label="Agent hierarchy">
          <header><h2>Agent Hierarchy</h2></header>
          <div class="al-search"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="searchName" type="search" placeholder="Search agents" aria-label="Search agents"></div>
          <div class="al-tree-scroll">
            <div class="al-provider-row">
              <button id="providerToggle" class="al-provider" type="button" aria-expanded="true" aria-controls="agentTree"><span class="material-symbols-rounded" aria-hidden="true">expand_more</span><img src="assets/hierarchy-icons/service-provider.svg" alt=""><span id="providerRootName">wizarpos</span></button>
              <button id="addAgent" class="al-icon-btn" type="button" aria-label="Add Level 1 Agent" title="Add Level 1 Agent"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
            </div>
            <div id="agentTree" role="tree" aria-label="Agents"></div>
            <p id="treeEmpty" class="al-empty" hidden>No agents found.</p>
          </div>
        </aside>
        <section id="agentDetail" class="al-detail" aria-label="Agent details"></section>
      </div>
    </section>
  </main></div>
  <dialog id="createDialog" class="al-dialog" aria-labelledby="createTitle">
    <header class="al-dialog-head"><h2 id="createTitle">Add Agent</h2><button class="al-icon-btn" type="button" id="closeCreate" aria-label="Close"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></header>
    <form id="createForm" novalidate><div id="createBody" class="al-dialog-body"></div><footer class="al-footer"><button class="al-btn" type="button" id="cancelCreate">Cancel</button><button class="al-btn al-primary" type="submit">Create Agent</button></footer></form>
  </dialog>
  <div id="agentActionTooltip" class="al-action-tooltip" role="tooltip" popover="manual"></div>
  <dialog id="confirmDialog" class="al-dialog al-confirm" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <header class="al-dialog-head"><h2 id="confirmTitle"></h2></header>
    <div class="al-dialog-body"><p id="confirmMessage"></p></div>
    <footer class="al-footer"><button class="al-btn" type="button" id="confirmCancel">Cancel</button><button class="al-btn al-primary" type="button" id="confirmAccept">Confirm</button></footer>
  </dialog>
  <script src="scripts/uptime-combobox.js"></script>
  <script src="scripts/agent-list.js"></script>
  <script src="scripts/platform-admin-shell.js"></script>
</body>
</html>
