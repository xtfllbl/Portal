<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版计算器</title>
    <style>
        /* CSS 样式部分：负责让计算器变得好看 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .calculator {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 320px;
        }

        .display {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .expression {
            color: #6c757d;
            font-size: 16px;
            min-height: 20px;
            word-wrap: break-word;
        }

        .result {
            color: #212529;
            font-size: 36px;
            font-weight: bold;
            margin-top: 5px;
            word-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 50%;
            height: 65px;
            font-size: 24px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: #f1f3f5;
            color: #212529;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 专门为操作符和特殊按钮定制的颜色 */
        .operator {
            background-color: #ff9800;
            color: white;
        }

        .operator:hover { background-color: #e68a00; }

        .action {
            background-color: #e9ecef;
            color: #495057;
        }

        .action:hover { background-color: #dee2e6; }

        button:hover:not(.operator):not(.action) {
            background-color: #e2e6ea;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="action" onclick="clearAll()">AC</button>
            <button class="action" onclick="deleteLast()">C</button>
            <button class="action" onclick="appendValue('(')">(</button>
            <button class="action" onclick="appendValue(')')">)</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('÷')">÷</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('×')">×</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>
            <button class="operator" onclick="appendValue('+')">+</button>
        </div>
    </div>

    <script>
        let currentExpression = '';
        const expressionDisplay = document.getElementById('expression');
        const resultDisplay = document.getElementById('result');

        // 更新屏幕显示
        function updateDisplay(resultValue = null) {
            expressionDisplay.innerText = currentExpression;
            if (resultValue !== null) {
                resultDisplay.innerText = resultValue;
            } else if (currentExpression === '') {
                resultDisplay.innerText = '0';
            }
        }

        // 追加字符（数字或符号）
        function appendValue(value) {
            currentExpression += value;
            updateDisplay();
        }

        // 全部清空 (AC)
        function clearAll() {
            currentExpression = '';
            updateDisplay('0');
        }

        // 退格删除 (C)
        function deleteLast() {
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
        }

        // 计算结果 (=)
        function calculate() {
            if (currentExpression === '') return;

            try {
                // 将显示用的乘除号替换为 JavaScript 认识的运算符号
                let mathExpression = currentExpression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                // 使用 Function 构造函数安全地执行数学运算 (比 eval 略好)
                let result = new Function('return ' + mathExpression)();

                // 处理浮点数精度问题并格式化
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8)); // 保留最多8位小数
                }

                updateDisplay(result);
            } catch (error) {
                updateDisplay('Error');
            }
        }
    </script>
</body>
</html>
