<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impersonate | PAYwizard Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/platform-admin-shell.css"><link rel="stylesheet" href="styles/impersonation.css">
</head>
<body>
<main class="imp-page pw-module-page-surface" id="impersonateApp">
  <h1 class="pw-module-page-title">Impersonate</h1>
  <div class="imp-layout">
    <section class="imp-hierarchy" aria-labelledby="hierarchyTitle">
      <h2 id="hierarchyTitle">Entity Hierarchy</h2>
      <input id="entitySearch" type="search" placeholder="Search" aria-label="Search entities" autocomplete="off">
      <div class="imp-tree-scroll"><ul id="entityTree" role="tree" aria-label="Entity Hierarchy"></ul><p id="treeEmpty" class="imp-empty" hidden>No matching entities.</p></div>
    </section>
    <section class="imp-entity" aria-labelledby="entityName">
      <header class="imp-hero"><div><span id="entityType"></span><h2 id="entityName"></h2></div><span class="imp-status">Active</span></header>
      <dl class="imp-fields"><div><dt>Entity Type</dt><dd id="entityTypeDetail"></dd></div><div><dt>Parent Path</dt><dd id="entityParent"></dd></div></dl>
      <div class="imp-users">
        <div class="imp-error" id="entryError" role="alert" tabindex="-1" hidden></div>
        <header class="imp-users-heading"><h2>Users</h2><label class="imp-search"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="userSearch" type="search" placeholder="Search users" aria-label="Search direct users" autocomplete="off"></label></header>
        <div class="imp-table-scroll"><table class="imp-table" aria-label="Direct users"><colgroup><col class="imp-col-user"><col class="imp-col-email"><col class="imp-col-role"><col class="imp-col-permissions"><col class="imp-col-action"></colgroup><thead><tr><th scope="col">USER</th><th scope="col">EMAIL</th><th scope="col">ROLE</th><th scope="col">PERMISSIONS</th><th scope="col">ACTION</th></tr></thead><tbody id="userRows"></tbody></table></div>
        <p class="imp-empty" id="usersEmpty" role="status" hidden></p>
      </div>
    </section>
  </div>
</main>
<script src="scripts/platform-admin-shell.js"></script><script src="scripts/entity-hierarchy-data.js"></script><script src="scripts/impersonation-data.js"></script><script src="scripts/impersonation.js"></script>
</body></html>
